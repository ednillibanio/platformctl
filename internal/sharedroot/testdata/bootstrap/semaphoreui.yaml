version: 1
consumer: provision-semaphoreui
automation_key: true
target:
  - name: GOVC_URL
    required: true
    description: vCenter SDK URL of the target
    example: https://vcenter.example.test/sdk
  - name: TARGET_FOLDER
    required: true
    description: VM folder of the service hosts
host:
  - name: HOST_IP
    required: true
    description: Static IPv4 address of the SemaphoreUI host
target_credentials:
  - name: GOVC_PASSWORD
    identity: vcenter-access-admin
    required: true
    description: Password of the vCenter account

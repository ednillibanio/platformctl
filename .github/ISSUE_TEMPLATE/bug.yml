name: Bug / Problema
description: Algo quebrado fora do fluxo de uma iteração formal
title: "[bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: modulo
    attributes:
      label: Módulo/área afetada
      options:
        - CLI
        - configuração/scaffold
        - parsing/validação
        - merge/render
        - schemas
        - instalação/toolchain
        - vagrant/lab
        - container/lab
        - CI/build
        - documentação
        - integração externa
        - outro
    validations:
      required: true
  - type: dropdown
    id: plataforma
    attributes:
      label: Plataforma/ambiente
      options:
        - Linux
        - macOS
        - Windows
        - container/lab
        - vagrant/lab
        - N/A
    validations:
      required: false
  - type: textarea
    id: esperado
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: atual
    attributes:
      label: Comportamento atual
    validations:
      required: true
  - type: textarea
    id: reproducao
    attributes:
      label: Passos para reproduzir
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs/evidência
      render: shell
    validations:
      required: false

name: Bug / Problema
description: Algo quebrado fora do fluxo de uma iteração formal
title: "[bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: modulo
    attributes:
      label: Módulo/área afetada
      options:
        - sshd
        - php
        - apache
        - mariadb
        - crowdsec
        - fail2ban
        - packer
        - terraform
        - ansible
        - vagrant/lab
        - outro
    validations:
      required: true
  - type: dropdown
    id: distro
    attributes:
      label: Distro
      options:
        - Oracle Linux 9
        - Oracle Linux 8
        - Ubuntu 24.04
        - N/A
    validations:
      required: false
  - type: textarea
    id: esperado
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: atual
    attributes:
      label: Comportamento atual
    validations:
      required: true
  - type: textarea
    id: reproducao
    attributes:
      label: Passos para reproduzir
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs/evidência
      render: shell
    validations:
      required: false

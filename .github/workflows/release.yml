name: release

# A pushed v* tag on a commit of main builds the binaries and publishes a
# GitHub release. A pull request or a manual run (even against a tag) builds
# the same files as a workflow artifact only, so the workflow is tested
# without publishing anything.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the main ancestry check
      - name: Release source
        # A release is published only from a commit already on main.
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} points to a commit that is not on main"
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Bootstrap
        run: ./scripts/bootstrap-dev.sh
      - name: Test
        run: ./scripts/go.sh test ./...
      - name: Version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = tag ]; then
            echo "version=${REF_NAME}" >>"$GITHUB_OUTPUT"
          else
            echo "version=dev-$(git rev-parse --short=12 HEAD)" >>"$GITHUB_OUTPUT"
          fi
      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/release-build.sh "$VERSION" dist
      - name: Check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          test "$(./platformctl-linux-amd64 --version)" = "platformctl version ${VERSION}"
      - uses: actions/upload-artifact@v4
        with:
          name: platformctl-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: platformctl-${{ github.ref_name }}
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/* --repo "$REPO" --title "$TAG" \
            --verify-tag --notes "platformctl ${TAG}; see docs/installation.md to install."
